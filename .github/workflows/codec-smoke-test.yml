name: Codec smoke test

on:
  workflow_dispatch:
    inputs:
      channel_uuid:
        description: Channel UUID (leave blank to use the original test channel)
        required: false
        default: "64a90ba95d1f9feb0a798a20bbf0f40c"
        type: string
      test_os:
        description: Operating system (GitHub's latest stable runner image)
        required: true
        default: linux
        type: choice
        options:
          - linux
          - windows
          - macos
          - all
      duration_minutes:
        description: Recording duration per codec in minutes (5-20)
        required: true
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: chzzk-recording-integration-test
  cancel-in-progress: false

jobs:
  record:
    name: Record H.264, HEVC, and AV1 (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.test_os == 'all' && '["ubuntu-latest","windows-latest","macos-latest"]' || inputs.test_os == 'windows' && '["windows-latest"]' || inputs.test_os == 'macos' && '["macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    env:
      CHANNEL_ID: ${{ inputs.channel_uuid }}
      DURATION_MINUTES: ${{ inputs.duration_minutes }}

    steps:
      - name: Check out dev test code
        uses: actions/checkout@v6
        with:
          ref: dev
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Validate test input
        run: uv run --no-sync python scripts/run_recording_test.py validate codec

      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install_ffmpeg_ci_windows.ps1

      - name: Save test environment
        if: always()
        run: uv run --no-sync python scripts/run_recording_test.py environment

      - name: Record and verify every codec
        run: uv run --no-sync python scripts/run_recording_test.py codec

      - name: Upload codec test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codec-smoke-logs-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chzzk-codec-logs
            ${{ runner.temp }}/chzzk-codec-*/log.log
            ${{ runner.temp }}/chzzk-codec-*/continuity.jsonl
            ${{ runner.temp }}/chzzk-codec-*/continuity-summary.json
            ${{ runner.temp }}/chzzk-test-environment.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
