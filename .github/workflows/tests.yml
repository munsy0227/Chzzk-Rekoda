name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        native: [false, true]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          uv sync --locked

      - name: Build and test optional Rust helper
        if: matrix.native
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          cargo +stable test --locked --manifest-path native/Cargo.toml
          cargo +stable build --release --locked --manifest-path native/Cargo.toml

      - name: Run regression tests
        run: uv run --no-sync python -m unittest discover -s tests -v

  native-cross-platform:
    name: Native regression tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Test native helper
        run: cargo +stable test --locked --manifest-path native/Cargo.toml

      - name: Build native helper
        run: cargo +stable build --release --locked --manifest-path native/Cargo.toml

      - name: Verify native build is discoverable
        run: uv run --no-sync python -c "from native_backend import native_executable; assert native_executable() is not None"

      - name: Run native recording regressions
        run: uv run --no-sync python -m unittest discover -s tests -p test_native_recording.py -v

      - name: Run native report regressions
        run: uv run --no-sync python -m unittest discover -s tests -p test_native_report.py -v

      - name: Run recording CI regressions
        run: uv run --no-sync python -m unittest discover -s tests -p test_recording_ci.py -v

      - name: Run optional Rust installation regressions
        run: uv run --no-sync python -m unittest discover -s tests -p "test_*install*.py" -v
